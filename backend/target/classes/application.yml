spring:
  application:
    name: train-traffic-control

  # Default to H2 so the app starts without a local MySQL install.
  # Use profile "mysql" when MySQL Workbench/server is available.
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
