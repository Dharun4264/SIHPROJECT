# Local development profile — no MySQL required.
# Run: .\mvnw.cmd spring-boot:run
spring:
  datasource:
    url: jdbc:h2:mem:train_traffic_control;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
